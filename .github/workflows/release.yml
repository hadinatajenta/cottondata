name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.11.0). Leave empty to derive from Cargo.toml.'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            RAW_TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TAG="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build macOS arm64 bundle
        env:
          TARGET: aarch64-apple-darwin
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/bundle-macos.sh

      - name: Upload macOS arm64 assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            dist/CottonData-macos-arm64.zip
            dist/CottonData-macos-arm64.dmg
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS (x64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-x64

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            RAW_TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TAG="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build macOS x64 bundle
        env:
          TARGET: x86_64-apple-darwin
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/bundle-macos.sh

      - name: Upload macOS x64 assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: |
            dist/CottonData-macos-x64.zip
            dist/CottonData-macos-x64.dmg
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag }}"
          if (-not [string]::IsNullOrWhiteSpace($inputTag)) {
            $rawTag = $inputTag
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $rawTag = $env:GITHUB_REF_NAME
          } else {
            $cargoVer = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
            $rawTag = "v$cargoVer"
          }
          $ver = $rawTag.TrimStart('v')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"

      - name: Build Windows portable archive
        shell: pwsh
        run: .\scripts\bundle-windows.ps1

      - name: Build Windows Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $isccPath = $defaultPath
            } else {
              choco install innosetup -y --no-progress
              $isccPath = $defaultPath
            }
          } else {
            $isccPath = $iscc.Source
          }
          & $isccPath "/DMyAppVersion=${{ steps.version.outputs.version }}" scripts\installer-windows.iss

      - name: Upload Windows x64 assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/CottonData-windows-x64.zip
            dist/CottonData-setup-windows-x64.exe
          if-no-files-found: error

  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            dpkg-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            RAW_TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TAG="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build Linux tarball and deb package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH_LABEL: x64
          DEB_ARCH: amd64
        run: ./scripts/bundle-linux.sh

      - name: Upload Linux x64 assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dist/CottonData-linux-x64.tar.gz
            dist/cottondata_${{ steps.version.outputs.version }}_amd64.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-windows-x64
      - build-linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag and version
        id: meta
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          LC_ALL=C find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract changelog release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [[ -s release-notes.md ]] && grep -q '[^[:space:]]' release-notes.md; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
        shell: bash
        run: |
          shopt -s nullglob
          ASSETS=(release-assets/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            if [[ "$HAS_NOTES" == "true" ]]; then
              gh release edit "$TAG" --title "CottonData ${TAG}" --notes-file release-notes.md
            fi
          else
            if [[ "$HAS_NOTES" == "true" ]]; then
              gh release create "$TAG" "${ASSETS[@]}" \
                --title "CottonData ${TAG}" \
                --notes-file release-notes.md
            else
              gh release create "$TAG" "${ASSETS[@]}" \
                --title "CottonData ${TAG}" \
                --generate-notes
            fi
          fi
