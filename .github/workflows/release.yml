name: Release Build (macOS + Linux + Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run workspace tests
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --workspace
      - name: Bundle macOS .app, .zip, and .dmg
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x scripts/bundle-macos.sh
          ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CottonData-${{ matrix.target }}
          path: |
            dist/CottonData-macos-*.zip
            dist/CottonData-macos-*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Bundle Linux .tar.gz and .deb
        run: |
          chmod +x scripts/bundle-linux.sh
          ./scripts/bundle-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CottonData-linux-x64
          path: |
            dist/CottonData-linux-x64.tar.gz
            dist/cottondata_*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build & package Windows portable zip
        shell: pwsh
        run: .\scripts\bundle-windows.ps1
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc scripts\installer-windows.iss
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CottonData-windows-x64
          path: |
            dist/CottonData-windows-x64.zip
            dist/CottonData-setup-windows-x64.exe

  publish-release:
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
